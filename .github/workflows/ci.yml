name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; nothing in CI needs to write.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.23'
          cache: true

      # The tests build real repositories, so they need an identity. Without
      # one, `git commit` fails on a clean runner and every test errors.
      - name: give git an identity for the fixture repos
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name CI
          git config --global init.defaultBranch main

      - name: git version (decides the conflict-probe path)
        run: git --version

      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -count=1

  legacy-git:
    name: pre-2.38 git fallback
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.23'
          cache: true
      # ubuntu-22.04 ships git 2.34, which lacks `merge-tree --write-tree`.
      # This job keeps the legacy conflict path honest.
      - run: git --version
      - run: |
          git config --global user.email ci@example.invalid
          git config --global user.name CI
          git config --global init.defaultBranch main
      - run: go test ./... -count=1

  # Known vulnerabilities that the code can actually reach. Advisories in
  # dependencies the code never calls are reported but do not fail the build.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: stable

  # Every commit, not just the tip: a secret removed later is still in history.
  # gitleaks is built from source at a pinned version, so Go's checksum
  # database vouches for it and no third-party action is trusted.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      - name: gitleaks
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner .
