name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No install step on purpose: landfirst has zero dependencies.
      - name: git version (determines the conflict-probe path)
        run: git --version
      - name: configure a git identity for the fixture repos
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name CI
      - run: npm test

  legacy-git:
    name: pre-2.38 git fallback
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # ubuntu-22.04 ships git 2.34, which lacks `merge-tree --write-tree`.
      # This job exists to keep the legacy conflict path honest.
      - run: git --version
      - run: |
          git config --global user.email ci@example.invalid
          git config --global user.name CI
      - run: npm test
