name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      # The tests build real repositories, so they need an identity. Without
      # one, `git commit` fails on a clean runner and every test errors.
      - name: give git an identity for the fixture repos
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name CI
          git config --global init.defaultBranch main

      - name: git version (decides the conflict-probe path)
        run: git --version

      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -count=1

  legacy-git:
    name: pre-2.38 git fallback
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      # ubuntu-22.04 ships git 2.34, which lacks `merge-tree --write-tree`.
      # This job keeps the legacy conflict path honest.
      - run: git --version
      - run: |
          git config --global user.email ci@example.invalid
          git config --global user.name CI
          git config --global init.defaultBranch main
      - run: go test ./... -count=1
