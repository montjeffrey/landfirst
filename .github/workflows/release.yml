name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: build every platform
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          # CGO off so each binary is fully static and needs no runtime.
          build() {
            local os=$1 arch=$2 ext=${3:-}
            local name="landfirst-${os}-${arch}${ext}"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build \
              -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${name}" ./cmd/landfirst
            echo "built ${name}"
          }
          build linux   amd64
          build linux    arm64
          build darwin  amd64
          build darwin  arm64
          build windows amd64 .exe
          build windows arm64 .exe

      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
