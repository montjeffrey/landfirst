name: release

# A v* tag tests the tagged commit, builds a static binary for every
# platform, publishes them with SHA-256 checksums, and attaches a build
# provenance attestation proving each binary came from this repository and
# this workflow. Verify a download with:
#   gh attestation verify landfirst-linux-amd64 --repo montjeffrey/landfirst
#
# Two jobs, so the one that runs the project's code holds no write access:
# `build` checks out, tests and compiles with a read-only token and passes the
# binaries on as an artifact; only `publish` - which runs no project code, only
# the pinned attest action and `gh` - gets contents/id-token/attestations write.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          # No shared build cache: a release is built from the tagged commit
          # alone, never from something an earlier workflow run left behind.
          cache: false

      # Never ship what has not passed: the tagged commit is tested again here.
      - name: test the tagged commit
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name CI
          git config --global init.defaultBranch main
          go test ./... -count=1

      - name: build every platform
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          # CGO off so each binary is fully static and needs no runtime.
          build() {
            local os=$1 arch=$2 ext=${3:-}
            local name="landfirst-${os}-${arch}${ext}"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build \
              -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${name}" ./cmd/landfirst
            echo "built ${name}"
          }
          build linux   amd64
          build linux    arm64
          build darwin  amd64
          build darwin  arm64
          build windows amd64 .exe
          build windows arm64 .exe

      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/landfirst-*"

      # No checkout here, so gh needs the repository named explicitly.
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
