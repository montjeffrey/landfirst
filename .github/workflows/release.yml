name: release

# A v* tag tests the tagged commit, builds a static binary for every
# platform, publishes them with SHA-256 checksums, and attaches a build
# provenance attestation proving each binary came from this repository and
# this workflow. Verify a download with:
#   gh attestation verify landfirst-linux-amd64 --repo montjeffrey/landfirst

on:
  push:
    tags: ['v*']

permissions:
  contents: write      # create the release
  id-token: write      # sign the provenance attestation
  attestations: write  # store it

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.23'
          cache: true

      # Never ship what has not passed: the tagged commit is tested again here.
      - name: test the tagged commit
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name CI
          git config --global init.defaultBranch main
          go test ./... -count=1

      - name: build every platform
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          # CGO off so each binary is fully static and needs no runtime.
          build() {
            local os=$1 arch=$2 ext=${3:-}
            local name="landfirst-${os}-${arch}${ext}"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build \
              -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${name}" ./cmd/landfirst
            echo "built ${name}"
          }
          build linux   amd64
          build linux    arm64
          build darwin  amd64
          build darwin  arm64
          build windows amd64 .exe
          build windows arm64 .exe

      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/landfirst-*"

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
